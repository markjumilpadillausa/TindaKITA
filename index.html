<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TindaKita</title>
<meta name="description" content="Family store app: beverage sales, photo catalogue, and an equal monthly share of the profit.">
<meta name="theme-color" content="#F2F7F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TindaKita">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="favicon.svg"><link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://script.google.com"><link rel="preconnect" href="https://drive.google.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" media="print" onload="this.media='all'">
<style>
/* Layout: phone-first store app. Header, month pills, profit hero, share card, photo catalogue grid, bottom tab bar. Bottom sheets for selling and forms. Receipt styling for the sale and share breakdown. */
:root{
  --bg:#F1F6F7; --surface:#FFFFFF; --surface2:#E4EDEF; --ink:#10252A; --ink2:#4A6168; --line:#D0DEE1;
  --cap:#D62839; --cap-ink:#FFFFFF; --cap-soft:#FBE3E6;
  --glass:#0B7A75; --glass-soft:#D5F0EE;
  --warn:#8A5A00; --warn-soft:#FBEBC8;
  --hero-bg:#0F3B3D; --hero-fg:#EAF8F7; --hero-dim:#9CC8C5;
  --backdrop:rgba(8,20,23,.55);
  --font-display:'Bricolage Grotesque',ui-rounded,'Segoe UI',system-ui,sans-serif;
  --font-body:'Figtree',system-ui,'Segoe UI',Roboto,sans-serif;
  --font-num:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1619; --surface:#12262A; --surface2:#1B353A; --ink:#E7F1F2; --ink2:#9DB5BA; --line:#27454B;
    --cap:#FF5C6E; --cap-ink:#2A070C; --cap-soft:#3A1A20;
    --glass:#43CFC5; --glass-soft:#123F3E;
    --warn:#F0C36A; --warn-soft:#3A2D10;
    --hero-bg:#0F3B3D; --hero-fg:#EAF8F7; --hero-dim:#9CC8C5;
    --backdrop:rgba(0,0,0,.65);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1619; --surface:#12262A; --surface2:#1B353A; --ink:#E7F1F2; --ink2:#9DB5BA; --line:#27454B;
  --cap:#FF5C6E; --cap-ink:#2A070C; --cap-soft:#3A1A20;
  --glass:#43CFC5; --glass-soft:#123F3E;
  --warn:#F0C36A; --warn-soft:#3A2D10;
  --hero-bg:#0F3B3D; --hero-fg:#EAF8F7; --hero-dim:#9CC8C5;
  --backdrop:rgba(0,0,0,.65);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0}
body{
  background:var(--bg); color:var(--ink); font:15px/1.45 var(--font-body);
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); padding-block:0;
  -webkit-font-smoothing:antialiased;
}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--glass);outline-offset:2px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.wrap{max-width:960px;margin:0 auto;padding-block:14px 120px}
.muted{color:var(--ink2)}
.sm{font-size:13px}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:20px;font-weight:700}
h3{font-size:16px;font-weight:700}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.stack{display:grid;gap:14px}
.hide{display:none!important}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px 14px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:800;font-size:22px;letter-spacing:-.02em}
.who{display:flex;align-items:center;gap:8px;min-width:0}
.who span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42vw}

/* buttons */
.btn{border:0;border-radius:12px;padding:11px 16px;min-height:44px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn svg{flex:none}
.btn.primary{background:var(--cap);color:var(--cap-ink)}
.btn.soft{background:var(--surface2);color:var(--ink)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{background:var(--cap-soft);color:var(--cap)}
.btn.sm{min-height:36px;padding:7px 12px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.iconbtn{border:0;background:var(--surface2);border-radius:10px;width:40px;height:40px;display:grid;place-items:center}

/* chips */
.chip{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:var(--surface2);color:var(--ink2);white-space:nowrap}
.chip.admin{background:var(--cap-soft);color:var(--cap)}
.chip.user{background:var(--glass-soft);color:var(--glass)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.ok{background:var(--glass-soft);color:var(--glass)}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;background:var(--glass-soft);color:var(--glass);flex:none}
.avatar.lg{width:64px;height:64px;font-size:26px;background:var(--cap);color:var(--cap-ink)}

/* months */
.months{display:flex;gap:8px;overflow-x:auto;padding-block:2px 12px;scrollbar-width:none}
.months::-webkit-scrollbar{display:none}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 14px;font-weight:600;font-size:13px;white-space:nowrap}
.pill.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* hero */
.hero{background:var(--hero-bg);color:var(--hero-fg);border-radius:20px;padding:20px 20px 18px;display:grid;gap:6px}
.hero .lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--hero-dim);font-weight:600}
.hero .big{font-family:var(--font-display);font-weight:800;font-size:clamp(36px,10vw,52px);letter-spacing:-.03em;line-height:1.05}
.hero .sub{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--hero-dim);font-size:13px}
.hero .sub b{color:var(--hero-fg);font-weight:600}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.list>*+*{border-top:1px solid var(--line)}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px}
.li.me{background:var(--glass-soft)}
.li .amt{font-family:var(--font-num);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.pos{color:var(--glass)}
.neg{color:var(--cap)}

/* catalogue */
.cat-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:16px;min-height:44px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.item{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:0;text-align:left;overflow:hidden;display:grid;grid-template-rows:auto 1fr}
.item:active{transform:scale(.985)}
.item .ph{aspect-ratio:1/1;background:var(--surface2);display:grid;place-items:center;color:var(--ink2);overflow:hidden}
.item .ph img{width:100%;height:100%;object-fit:cover;display:block}
.item .in{padding:10px 12px 12px;display:grid;gap:4px;align-content:start}
.item .nm{font-family:var(--font-display);font-weight:700;font-size:15px;line-height:1.2;overflow-wrap:anywhere}
.item .pr{font-family:var(--font-num);font-size:12px;color:var(--ink2);display:grid;gap:1px}
.empty{border:1.5px dashed var(--line);border-radius:16px;padding:28px 18px;text-align:center;display:grid;gap:10px;justify-items:center;color:var(--ink2)}

/* tables */
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:480px}
th,td{padding:10px 12px;text-align:right;white-space:nowrap;font-size:13px;border-top:1px solid var(--line)}
th:first-child,td:first-child{text-align:left;white-space:normal}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);border-top:0;font-weight:700}
td.num{font-size:13px}
.day{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);font-weight:700;padding:6px 2px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:2px;min-width:0}
.tile .v{font-family:var(--font-num);font-weight:600;font-size:15px;overflow-wrap:anywhere}
.bar{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--glass);border-radius:99px}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));z-index:5}
.nav .in{max-width:960px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px}
.nav button{border:0;background:transparent;display:grid;justify-items:center;gap:2px;padding:8px 4px;border-radius:12px;font-size:12px;font-weight:600;color:var(--ink2)}
.nav button.on{color:var(--cap);background:var(--cap-soft)}

/* forms */
.field{display:grid;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--ink2)}
.field input{width:100%;min-height:46px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--surface2);padding:4px;border-radius:12px}
.seg button{border:0;background:transparent;border-radius:9px;padding:9px 8px;font-weight:600;font-size:14px;color:var(--ink2);min-height:40px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.err{color:var(--cap);font-size:13px;font-weight:600;min-height:18px}
.photo{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center}
.photo .box{width:96px;height:96px;border-radius:14px;background:var(--surface2);display:grid;place-items:center;overflow:hidden;color:var(--ink2)}
.photo .box img{width:100%;height:100%;object-fit:cover}

/* receipt */
.receipt{background:var(--surface2);border-radius:12px;padding:14px;display:grid;gap:6px;font-family:var(--font-num);font-size:13px;font-variant-numeric:tabular-nums}
.receipt .r{display:flex;justify-content:space-between;gap:12px}
.receipt .r span:first-child{min-width:0;overflow-wrap:anywhere}
.receipt .tot{font-size:16px;font-weight:600}
.receipt hr{border:0;border-top:2px dashed var(--line);margin:4px 0;width:100%}
.stepper{display:grid;grid-template-columns:52px 1fr 52px;gap:10px;align-items:center}
.stepper button{height:52px;border:0;border-radius:12px;background:var(--surface2);display:grid;place-items:center}
.stepper input{height:52px;text-align:center;font-family:var(--font-num);font-size:24px;font-weight:600;border:1px solid var(--line);border-radius:12px;background:var(--surface);width:100%;min-width:0}

/* sheet */
#sheet:empty{display:none}
#sheet{position:fixed;inset:0;z-index:20;background:var(--backdrop);display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--bg);width:100%;max-width:520px;max-height:92%;overflow-y:auto;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:14px}
@media (min-width:640px){#sheet{align-items:center}.panel{border-radius:22px;max-height:90%}}
.panel .hd{display:flex;align-items:center;justify-content:space-between;gap:10px}

/* login and pin pad */
.login{max-width:420px;margin:0 auto;padding-block:28px 40px;display:grid;gap:18px}
.tile-acc{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 14px;min-height:64px}
.dots{display:flex;gap:12px;justify-content:center;padding-block:6px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink2)}
.dots i.f{background:var(--cap);border-color:var(--cap)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{height:64px;border-radius:16px;border:1px solid var(--line);background:var(--surface);font-family:var(--font-num);font-size:24px;font-weight:600}
.pad button.act{background:var(--surface2);font-size:18px}
.pad button.go{background:var(--cap);color:var(--cap-ink);border-color:var(--cap)}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:30;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.shake{animation:none}#toast{transition:none}}
.acc{display:grid;gap:12px}
.pinrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--surface2);border-radius:12px;padding:10px 12px}
.pinrow .pv{font-family:var(--font-num);font-weight:600;font-size:16px;letter-spacing:.12em}
.wrapbtns{display:flex;flex-wrap:wrap;gap:8px}

/* ---- additions for the installable version ---- */
html{-webkit-text-size-adjust:100%}
.note{background:var(--surface2);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--ink2)}
.note.warn{background:var(--warn-soft);color:var(--warn);font-weight:600}
.lib{width:100%;border:0;background:transparent;text-align:left;font:inherit;color:inherit}
.lib:hover{background:var(--surface2)}
.li.voided .grow,.li.voided .amt1{opacity:.55}
.li.voided .amt1{text-decoration:line-through}
.li.me .avatar{background:var(--surface)}
.stamp{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2)}
.cmp{display:grid;grid-template-columns:1fr auto auto;gap:6px 16px;font-size:14px;align-items:baseline}
.cmp .num{text-align:right}
.cols{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.hero .big{overflow-wrap:anywhere}
@media (min-width:640px){.wrap{padding-block:20px 120px}.grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}}
/* laptops and desktops: side menu instead of the bottom bar */
@media (min-width:900px){
  body{padding-left:max(244px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
  .wrap{max-width:1040px;margin:0;padding-block:20px 60px}
  .nav{top:0;right:auto;bottom:0;width:216px;border-top:0;border-right:1px solid var(--line);padding:84px 12px 20px max(12px,env(safe-area-inset-left,0px))}
  .nav .in{grid-auto-flow:row;grid-auto-columns:auto;align-content:start;gap:6px;max-width:none}
  .nav button{grid-auto-flow:column;justify-content:start;align-items:center;gap:12px;font-size:15px;padding:12px 14px}
  #toast{bottom:28px}
  .top .brand{position:fixed;left:max(16px,env(safe-area-inset-left,0px));top:calc(18px + env(safe-area-inset-top,0px));z-index:6}
  .tiles{max-width:560px}
}

/* v3 look: no boxed icons, status bar, avatars */
.phico{display:inline-flex;vertical-align:middle;padding:3px 5px;border-radius:8px;background:var(--glass-soft);color:var(--glass);margin-left:4px;cursor:pointer}
.shotbox{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}.shotbox img{max-width:96vw;max-height:80vh;object-fit:contain;border-radius:10px;background:#fff}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;background:var(--bg);padding-block:8px 10px;align-items:flex-start;gap:10px}
.stat{display:grid;gap:2px;justify-items:end;min-width:0}
.clock{font-size:12px;font-weight:600;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
.syncp{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;padding:2px 0;font-size:12px;font-weight:700;color:var(--ink);min-height:0;max-width:62vw}
.syncp span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:#1FA37A;display:inline-block;flex:none}
.dot.off{background:var(--cap)}.dot.busy{background:#E0A100;animation:tkpulse 1s infinite}
@keyframes tkpulse{50%{opacity:.3}}
.nav button{background:transparent!important;border-radius:0;position:relative}
.nav button.on{color:var(--cap)}
.nav button.on::before{content:"";position:absolute;top:-6px;left:24%;right:24%;height:3px;border-radius:0 0 3px 3px;background:var(--cap)}
.nav button .ic{stroke-width:1.8}
.iconbtn{background:transparent!important}
.avbtn{position:relative;border:0;background:transparent;padding:0;border-radius:50%;flex:none;display:block}
.avcam{position:absolute;right:-2px;bottom:-2px;width:26px;height:26px;border-radius:50%;background:var(--cap);color:var(--cap-ink);display:grid;place-items:center;border:2px solid var(--bg)}
.avatar{overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.rrow{display:grid;grid-template-columns:1fr 1fr 1fr 40px;gap:8px;align-items:center}
.rrow input{width:100%;min-width:0;min-height:44px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font:15px var(--font-num);color:var(--ink)}
.rrow input:disabled{background:var(--surface2);color:var(--ink);opacity:1;-webkit-text-fill-color:var(--ink);border-color:transparent}
.rhead{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink2)}
.rtot{grid-column:1/-1;margin-top:-4px}
.rextra{display:grid;gap:8px;border-top:1px dashed var(--line);padding-top:10px}
#printarea{display:none}
.walt{grid-template-columns:repeat(2,1fr)}@media (min-width:900px){.walt{grid-template-columns:repeat(4,1fr)}}
.foot{margin-top:28px;padding-top:14px;border-top:1px solid var(--line);text-align:center;font-size:12px;line-height:1.6;color:var(--ink2)}.foot b{color:var(--ink);letter-spacing:.02em}
@media print{body>*:not(#printarea){display:none!important}#printarea{display:block;color:#000;background:#fff;font:12px/1.4 Arial,sans-serif;padding:0}#printarea h1{font-size:20px;margin:0}#printarea h2{font-size:14px;margin:16px 0 6px}#printarea .pm{margin:2px 0 8px;color:#444}#printarea table{width:100%;border-collapse:collapse}#printarea th,#printarea td{border-bottom:1px solid #bbb;padding:4px 6px;text-align:left}#printarea .r{text-align:right}#printarea tr{break-inside:avoid}}
@media (min-width:900px){.top{position:static}.stat{position:fixed;top:12px;right:20px;z-index:6;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 14px;box-shadow:0 2px 10px rgba(0,0,0,.08)}.syncp{max-width:none}}
@media (min-width:900px){.nav button.on::before{top:22%;bottom:22%;left:0;right:auto;width:3px;height:auto;border-radius:0 3px 3px 0}}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet" aria-live="polite"></div>
<div id="toast" role="status"></div>
<script>
(function(){
'use strict';
/* ================= SETTINGS ================= */

function calc(item,unit,qty){
 var bpc=Number(item.bottlesPerCase)||1,costCase=Number(item.costCase)||0,pb=Number(item.priceBottle)||0;

 return {revenue:revenue,cost:cost,profit:r2(revenue-cost),bottles:unit==='case'?bpc*qty:qty,priceB:pb,priceC:pc,costB:costB,costC:costCase,bpc:bpc};
}

 var cents=Math.round(profit*100),q=Math.trunc(cents/n),r=cents-q*n;

}

function monthOfTs(t){return new Date(t).toLocaleDateString('en-CA',{timeZone:TZ}).slice(0,7)}
function splitShares(v,ids){
 var n=ids.length,out={};if(!n)return out;
 var c=Math.round(v*100),q=Math.trunc(c/n),r=c-q*n,lead=ids.indexOf('yda')>-1?'yda':ids[0];
 ids.forEach(function(i){out[i]=q/100});
 if(r>0)out[lead]=(q+r)/100;else if(r<0){var o=ids.filter(function(x){return x!==lead})[0]||lead;out[o]=(q+r)/100}
 return out;
}

  var rev=r2(unit==='case'?pc*qty:pb*qty),cost=r2(unit==='case'?cc*qty:cc/bpc*qty),profit=r2(rev-cost),bt=unit==='case'?bpc*qty:qty;
  var sh=splitShares(profit,partners().map(function(a){return a.id}));
  S.sales=S.sales.concat([{id:id,at:o.at,month:mo,itemId:it.id,itemName:it.name,ml:it.ml,unit:unit,qty:qty,bottles:bt,revenue:rev,cost:cost,profit:profit,shares:sh,byId:me.id,byName:me.name,status:'ok',editCount:0,pending:true,orig:{qty:qty,revenue:rev,cost:cost,profit:profit,shares:sh}}]);

 }else if(o.action==='addGcash'){
  var type=d.type==='out'?'out':d.type==='load'?'load':'in',a=r2(d.amount),fee=(d.fee!==undefined&&d.fee!==null&&d.fee!=='')?r2(d.fee):feeOf(type,a);if(fee===null||!(a>0))return;

var flushing=false;
async function flush(){
 if(flushing||!S.token||!S.me||S.offline||!navigator.onLine)return;
 flushing=true;
 try{
  while(true){
   var it=S.outbox.filter(function(o){return o.me===S.me.id})[0];
   if(!it)break;
   try{S.inflight=it.cid;await api(it.action,Object.assign({},it.data,{cid:it.cid,clientAt:it.at}));S.inflight='';obSave(S.outbox.filter(function(o){return o.cid!==it.cid}))}
   catch(e){
    S.inflight='';
    if(e.code==='network'){S.offline=true;break}
    if(e.code==='unauthorized'||e.code==='mustchange')break;
    obSave(S.outbox.filter(function(o){return o.cid!==it.cid}));S.failed.push({label:it.label,msg:e.message});S.needSync=true;
   }
  }
 }finally{flushing=false;draw();if(S.needSync){S.needSync=false;sync(false)}}
}

}

function flowCancel(){var f=S.flow;if(!f)return;if(f.forced){logout();return}S.flow=null;draw()}
function logout(){S.token='';S.me=null;S.flow=null;S.tab='home';S.accounts=[];S.outbox=[];obSave([]);S.sales=[];S.gcash=[];S.gcashLog=[];S.imports=[];S.money=null;S.topups=[];S.purchases=[];S.items=[];S.log=[];S.logins=[];saveToken();loadPublic()}
async function submitFlow(){
 var f=S.flow;if(!f||f.busy)return;
 if(f.step==='pin'){
  if(f.entry.length<4){f.err='Enter your PIN.';f.shake=true;draw();return}
  f.busy=true;f.err='';draw();
  try{
   var j=await api('login',{id:f.id,pin:f.entry,device:device()});
   S.token=j.token;saveToken();S.tab='home';
   if(j.mustChange){S.flow={step:'new1',id:f.id,entry:'',err:'',first:'',forced:true}}
   else{S.flow=null;await api('sync')}
  }catch(e){f.busy=false;f.err=e.message;f.entry='';f.shake=true}
  draw();return;
 }
 if(f.step==='new1'){
  if(!/^\d{4,6}$/.test(f.entry)){f.err='Use 4 to 6 digits.';f.entry='';f.shake=true;draw();return}
  if(f.entry===DEFAULT_PIN){f.err='Choose a PIN that is not the default.';f.entry='';f.shake=true;draw();return}
  f.first=f.entry;f.entry='';f.step='new2';f.err='';draw();return;
 }
 if(f.step==='new2'){
  if(f.entry!==f.first){f.err='The two PINs did not match. Start again.';f.entry='';f.first='';f.step='new1';f.shake=true;draw();return}
  f.busy=true;draw();
  try{var j2=await api('setpin',{pin:f.first});S.token=j2.token;saveToken();S.flow=null;toast('New PIN saved')}
  catch(e){f.busy=false;f.step='new1';f.entry='';f.first='';f.err=e.message}
  draw();
 }
}
function padPress(d){
 var f=S.flow;if(!f||f.busy)return;
 f.shake=false;
 if(d==='back'){f.entry=f.entry.slice(0,-1);f.err=''}
 else if(d==='ok'){submitFlow();return}
 else if(f.entry.length<6){f.entry+=d;f.err=''}
 draw();
}
document.addEventListener('keydown',function(e){
 if(!S.flow||$sheet.firstChild)return;
 if(/^\d$/.test(e.key)){padPress(e.key)}
 else if(e.key==='Backspace'){padPress('back')}
 else if(e.key==='Enter'){padPress('ok')}
});

/* ================= install as an app ================= */
var deferredPrompt=null;
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferredPrompt=e;render()});
window.addEventListener('appinstalled',function(){deferredPrompt=null;toast('TindaKita is installed');render()});
function isStandalone(){return (window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true}
function installBlock(){
 if(isStandalone())return '';
 if(deferredPrompt)return '<button class="btn soft" data-act="install">Install TindaKita on this device</button>';
 if(/iPhone|iPad|iPod/.test(navigator.userAgent))return '<div class="note">To install on iPhone or iPad: tap the Share button in Safari, then Add to Home Screen.</div>';
 return '<div class="note">To install: open the browser menu and choose Install app or Add to Home screen.</div>';
}

/* resize a photo into a small square jpeg */
function squarePhoto(file){
 return new Promise(function(res,rej){
  var url=URL.createObjectURL(file),img=new Image();
  img.onload=function(){
   var s=Math.min(img.naturalWidth,img.naturalHeight),sx=(img.naturalWidth-s)/2,sy=(img.naturalHeight-s)/2,out=480;
   var cv=document.createElement('canvas');cv.width=out;cv.height=out;
   cv.getContext('2d').drawImage(img,sx,sy,s,s,0,0,out,out);
   URL.revokeObjectURL(url);res(cv.toDataURL('image/jpeg',0.72));
  };
  img.onerror=function(){URL.revokeObjectURL(url);rej(new Error('image'))};
  img.src=url;
 });
}

/* ================= statement reader ================= */
var MONTHS={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
function mkTime(y,mo,d,hh,mi,ss,ap){
 hh=+hh;if(ap){ap=ap.toUpperCase();if(ap==='PM'&&hh<12)hh+=12;if(ap==='AM'&&hh===12)hh=0}
 function z(n){return String(n).padStart(2,'0')}
 var t=Date.parse(y+'-'+z(mo)+'-'+z(d)+'T'+z(hh)+':'+z(mi)+':'+z(ss||0)+'+08:00');return isNaN(t)?0:t;
}
function findTime(s){
 var m=/(\d{4})-(\d{2})-(\d{2})[ T]+(\d{1,2}):(\d{2})(?::(\d{2}))?\s*(AM|PM)?/i.exec(s);
 if(m)return mkTime(m[1],m[2],m[3],m[4],m[5],m[6],m[7]);
 m=/(\d{1,2})\/(\d{1,2})\/(\d{4})[ ,]+(\d{1,2}):(\d{2})(?::(\d{2}))?\s*(AM|PM)?/i.exec(s);
 if(m)return mkTime(m[3],m[1],m[2],m[4],m[5],m[6],m[7]);
 m=/([A-Za-z]{3})[a-z]*\.? (\d{1,2}),? (\d{4})[ ,]+(\d{1,2}):(\d{2})(?::(\d{2}))?\s*(AM|PM)?/i.exec(s);
 if(m&&MONTHS[m[1].toLowerCase()])return mkTime(m[3],MONTHS[m[1].toLowerCase()],m[2],m[4],m[5],m[6],m[7]);
 return 0;
}
var START_RE=/^\s*(?:\d{4}-\d{2}-\d{2}|\d{1,2}\/\d{1,2}\/\d{4}|[A-Za-z]{3,9}\.? \d{1,2},? \d{4})(?:[ ,T]+\d{1,2}:\d{2}|\s*$)/;
var NUM_RE=/-?\d{1,3}(?:,\d{3})+\.\d{2}|-?\d+\.\d{2}/g;
var IGNORE_RE=/load|bill|pay\b|payment|merchant|\bqr\b|fee|gsave|gcredit|ggives|gloan|refund|interest|insurance|invest/i;
var TOPUP_RE=/cash.?in|7.?eleven|kiosk|cliqq|bank|instapay|pesonet|partner outlet|maribank|maya|seabank|gotyme|branch/i;
var DEBIT_RE=/send money|transfer to|sent to|express send|\bsent\b/i;
var CREDIT_RE=/received|transfer from|\bfrom\b|express/i;
function findRef(s){
 var m,re=/\b(\d{10,13})\b/g;
 while((m=re.exec(s))){if(!/^(09\d{9}|639\d{9})$/.test(m[1]))return m[1]}
 m=/\b(\d{4})\s(\d{3})\s(\d{3})\s(\d{3,4})\b/.exec(s);
 return m?m[1]+m[2]+m[3]+m[4]:'';
}
function parseRecords(recs){
 /* recs: [{parts:[{s,c}], hx:{debit,credit}}] */
 var out=[];
 recs.forEach(function(r){
  var text=r.parts.map(function(p){return p.s}).join(' ').replace(/\s+/g,' ').trim();
  var at=findTime(text),nums=[];
  r.parts.forEach(function(p){var m;NUM_RE.lastIndex=0;while((m=NUM_RE.exec(p.s))){nums.push({v:Math.abs(Number(m[0].replace(/,/g,''))),c:p.c})}});
  if(!nums.length)return;
  var bal=null,amt;
  if(nums.length>=2){bal=nums[nums.length-1].v;amt=nums[nums.length-2]}else amt=nums[0];
  var ref=findRef(text);
  var desc=text.replace(START_RE,'').replace(/\d{1,2}:\d{2}(:\d{2})?\s*(AM|PM)?/i,'').replace(NUM_RE,'').replace(ref,'').replace(/\s+/g,' ').trim().slice(0,80);
  out.push({at:at,ref:ref,desc:desc,amount:amt.v,c:amt.c,bal:bal,hx:r.hx,dir:''});
 });
 out.forEach(function(o,i){
  if(o.bal!==null){
   [out[i-1],out[i+1]].forEach(function(n){
    if(o.dir||!n||n.bal===null)return;
    if(Math.abs(n.bal-(o.bal+o.amount))<0.015)o.dir='debit';
    else if(Math.abs(n.bal-(o.bal-o.amount))<0.015)o.dir='credit';
   });
  }
  if(!o.dir&&o.hx&&o.hx.debit!=null&&o.hx.credit!=null&&o.c!=null)o.dir=Math.abs(o.c-o.hx.debit)<=Math.abs(o.c-o.hx.credit)?'debit':'credit';
  if(!o.dir)o.dir=CREDIT_RE.test(o.desc)&&!DEBIT_RE.test(o.desc)?'credit':DEBIT_RE.test(o.desc)?'debit':'';
 });
 return out.map(function(o){
  var type='';
  if(o.dir==='credit'&&TOPUP_RE.test(o.desc))type='topup';
  else if(!IGNORE_RE.test(o.desc)&&!(o.dir==='debit'&&TOPUP_RE.test(o.desc))){if(o.dir==='debit')type='in';else if(o.dir==='credit')type='out'}
  return {at:o.at,ref:o.ref,desc:o.desc,amount:o.amount,dir:o.dir,type:type};
 });
}
function loadScript(src){
 return new Promise(function(res,rej){var s=document.createElement('script');s.src=src;s.onload=res;s.onerror=function(){rej(new Error('Could not load '+src+'. Check the internet connection.'))};document.head.appendChild(s)});
}
async function loadPdfLib(){
 if(window.pdfjsLib)return;
 try{
  await loadScript('lib/pdf.min.js');if(!window.pdfjsLib)throw 0;
  var ok=await fetch('lib/pdf.worker.min.js');if(!ok.ok)throw 0;
  pdfjsLib.GlobalWorkerOptions.workerSrc='lib/pdf.worker.min.js';
 }catch(e){
  window.pdfjsLib=undefined;
  var base='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
  await loadScript(base+'pdf.min.js');
  var code=await (await fetch(base+'pdf.worker.min.js')).text();
  pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob([code],{type:'text/javascript'}));
 }
}
async function readPdf(buf,pw){
 await loadPdfLib();
 var doc;
 try{doc=await pdfjsLib.getDocument({data:buf,password:pw||undefined}).promise}
 catch(e){if(e&&e.name==='PasswordException')throw {pw:true,wrong:e.code===2};throw e}
 var recs=[],cur=null,hx={},raw=[];
 for(var pn=1;pn<=doc.numPages;pn++){
  var page=await doc.getPage(pn),tc=await page.getTextContent(),items=tc.items.filter(function(i){return i.str&&i.str.trim()});
  items.sort(function(a,b){return b.transform[5]-a.transform[5]||a.transform[4]-b.transform[4]});
  var lines=[];
  items.forEach(function(it){
   var y=it.transform[5],L=lines[lines.length-1];
   if(L&&Math.abs(L.y-y)<=3)L.items.push(it);else lines.push({y:y,items:[it]});
  });
  lines.forEach(function(L){
   L.items.sort(function(a,b){return a.transform[4]-b.transform[4]});
   var parts=L.items.map(function(it){return {s:it.str,c:it.transform[4]+(it.width||0)/2}});
   var text=parts.map(function(p){return p.s}).join(' ');
   raw.push(text);
   var hd=null,cr=null;
   parts.forEach(function(p){if(/^debit$/i.test(p.s.trim()))hd=p.c;if(/^credit$/i.test(p.s.trim()))cr=p.c});
   if(hd!=null&&cr!=null){hx={debit:hd,credit:cr};return}
   if(START_RE.test(text)){cur={parts:parts,hx:hx};recs.push(cur)}
   else if(cur)cur.parts=cur.parts.concat(parts);
  });
 }
 return {rows:parseRecords(recs),raw:raw.join('\n')};
}
async function readImage(file){
 await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js');
 var r=await Tesseract.recognize(file,'eng'),text=r.data.text,recs=[],cur=null;
 text.split('\n').forEach(function(l){
  l=l.trim();if(!l)return;
  if(START_RE.test(l)){cur={parts:[{s:l,c:null}],hx:null};recs.push(cur)}else if(cur)cur.parts.push({s:l,c:null});
 });
 return {rows:parseRecords(recs),raw:text};
}
function fileToDataUrl(file){return new Promise(function(res){var r=new FileReader();r.onload=function(){res(r.result)};r.onerror=function(){res('')};r.readAsDataURL(file)})}
function fileToBuf(file){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(r.result)};r.onerror=function(){rej(new Error('Could not open the file.'))};r.readAsArrayBuffer(file)})}

async function stmtLoad(p,file,pw){

 ST.file=file;msg.textContent=/pdf$/i.test(file.name)||file.type==='application/pdf'?'Reading the PDF...':'Reading the picture. This can take a minute...';

  else res=await readImage(file);

function shotImage(file){
 return new Promise(function(res,rej){
  var url=URL.createObjectURL(file),img=new Image();
  img.onload=function(){
   var m=Math.max(img.naturalWidth,img.naturalHeight),sc=Math.min(1,1100/m),w=Math.max(1,Math.round(img.naturalWidth*sc)),h=Math.max(1,Math.round(img.naturalHeight*sc));
   var cv=document.createElement('canvas');cv.width=w;cv.height=h;var cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,w,h);cx.drawImage(img,0,0,w,h);
   URL.revokeObjectURL(url);var q=0.72,d=cv.toDataURL('image/jpeg',q);while(d.length>800000&&q>0.3){q-=0.1;d=cv.toDataURL('image/jpeg',q)}res(d);
  };
  img.onerror=function(){URL.revokeObjectURL(url);rej(new Error('image'))};img.src=url;
 });
}
var MONTHS3={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
function shotParse(it,text){
 var t=String(text||'').replace(/\r/g,''),lines=t.split('\n').map(function(l){return l.trim()}).filter(Boolean),m,i;
 /* reference number first, so its digits are not mistaken for a phone number */
 var tp=t,ref='';
 m=t.match(/ref(?:erence)?\.?\s*(?:no\.?|number|num|#|id)?\s*[:.#]?\s*([0-9][0-9 ]{8,22}[0-9])/i);
 if(m){ref=m[1].replace(/\s/g,'');tp=t.replace(m[0],' ')}
 else{m=t.match(/ref(?:erence)?\.?\s*(?:no\.?|number|num|#|id)?\s*[:.#]?\s*([A-Za-z0-9]{6,24})/i);if(m){ref=m[1];tp=t.replace(m[0],' ')}
  else{m=t.match(/(?:^|[^\d])(\d{4}\s\d{3}\s\d{6})(?!\d)/);if(m){ref=m[1].replace(/\s/g,'');tp=t.replace(m[1],' ')}}}
 it.ref=ref.replace(/[^0-9A-Za-z]/g,'').slice(0,24);
 /* amount */
 var amt=0,NUM=/(\d{1,3}(?:,\d{3})+|\d+)\.(\d{2})(?!\d)/;
 for(i=0;i<lines.length&&!amt;i++){
  if(/amount/i.test(lines[i])&&!/total/i.test(lines[i])){m=lines[i].match(NUM)||(lines[i+1]||'').match(NUM);if(m)amt=parseFloat((m[1]+'.'+m[2]).replace(/,/g,''))}
 }
 if(!amt){m=tp.match(NUM);if(m)amt=parseFloat((m[1]+'.'+m[2]).replace(/,/g,''))}
 if(!amt){m=tp.match(/(?:php|₱)\s?(\d{1,3}(?:,\d{3})+|\d+)(?![\d.])/i);if(m)amt=parseFloat(m[1].replace(/,/g,''))}
 it.amount=amt>0?r2(amt):0;
 /* contact number */
 m=tp.match(/(?:^|[^\d])((?:\+?63|0)\s?9\d{2}[\s-]?\d{3}[\s-]?\d{4})(?!\d)/);
 if(m){var d=m[1].replace(/[^0-9]/g,'');if(d.indexOf('63')===0)d='0'+d.slice(2);it.phone=d}
 else{m=tp.match(/((?:\+?63|0)\s?9\d{2}[\s*xX•.-]{1,6}[*xX•.]{2,}[\s*xX•.-]*\d{2,4})/);if(m)it.phone=m[1].replace(/\s/g,'')}
 /* name */
 for(i=0;i<lines.length;i++){
  var l=lines[i],nm='';
  m=l.match(/^(?:sent to|send to|to|from|received from|recipient|receiver|sender|account name|name)\b\s*[:\-]?\s*(.+)$/i);
  if(m)nm=m[1];
  else if(/^(?:sent to|send to|from|to|received from|recipient|receiver|sender|account name|name)\s*[:\-]?$/i.test(l))nm=lines[i+1]||'';
  nm=nm.replace(/[^A-Za-z .,'\-ñÑ]/g,' ').replace(/\s+/g,' ').trim();
  if(nm.length>=3&&/[A-Za-z]{2}/.test(nm)&&!/gcash|maribank|amount|total|fee/i.test(nm)){it.name=nm.slice(0,40);break}
 }
 /* date and time */
 var dt=null;
 m=t.match(/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s+(\d{1,2})(?:st|nd|rd|th)?,?\s+(\d{4})(?:[,\s]+(?:at\s+)?(\d{1,2}):(\d{2})(?::\d{2})?\s*(am|pm)?)?/i);
 if(m){var hh=m[4]?+m[4]:12,mi=m[5]?+m[5]:0,ap=(m[6]||'').toLowerCase();if(ap==='pm'&&hh<12)hh+=12;if(ap==='am'&&hh===12)hh=0;dt=new Date(+m[3],MONTHS3[m[1].toLowerCase()],+m[2],hh,mi)}
 if(!dt){m=t.match(/(\d{4})-(\d{2})-(\d{2})(?:[ T]+(\d{1,2}):(\d{2}))?/);if(m)dt=new Date(+m[1],+m[2]-1,+m[3],m[4]?+m[4]:12,m[5]?+m[5]:0)}
 if(!dt){m=t.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})(?:[ ,]+(\d{1,2}):(\d{2})\s*(am|pm)?)?/i);if(m){var h2=m[4]?+m[4]:12,a2=(m[6]||'').toLowerCase();if(a2==='pm'&&h2<12)h2+=12;if(a2==='am'&&h2===12)h2=0;dt=new Date(+m[3],+m[1]-1,+m[2],h2,m[5]?+m[5]:0)}}
 if(dt&&!isNaN(dt.getTime())&&dt.getTime()<Date.now()+86400000&&dt.getFullYear()>2020){it.at=dt.getTime();it.dateRead=true}
 /* cash in or out, and a check that the right tab is used */
 if(it.kind==='gcash'){
  if(/cash\s*out|cashout|withdraw/i.test(t))it.type='out';
  else if(/cash\s*in|cashin|received|deposit/i.test(t))it.type='in';
  else it.hints.push('Check if this is cash in or cash out.');
  if(/buy\s*load|prepaid load|load\s*(?:successful|purchase)/i.test(t)&&!/cash\s*(?:in|out)/i.test(t))it.hints.push('This looks like a Load receipt. Check that you are in the right tab.');
 }else if(/cash\s*(?:in|out)/i.test(t)&&!/load/i.test(t))it.hints.push('This looks like a GCash cash in or cash out. Check that you are in the right tab.');
 if(!it.amount)it.hints.push('The amount could not be read. Tap Edit and type it.');
 if(!it.ref&&!it.phone)it.hints.push('No reference number or contact number was read.');
 if(!it.dateRead)it.hints.push('The date could not be read. It is set to now. Tap Edit to change it.');
}
function shotFee(it){
 if(it.feeManual)return;
 it.fee=it.amount>0?feeOf(it.type,it.amount,it.at):null;
}
async function shotsRead(p,files){
 var msg=p.querySelector('#sh-msg'),worker=null;
 msg.textContent='Loading the reader...';
 try{await loadScript(TESS_URL);worker=await Tesseract.createWorker('eng')}
 catch(e){msg.textContent=(e&&e.message)||'The reader could not load. Check the internet and try again.';return}
 for(var i=0;i<files.length;i++){
  msg.textContent='Reading '+(i+1)+' of '+files.length+'...';
  var it={n:++SH.uid,kind:SH.kind,type:SH.kind==='load'?'load':'in',amount:0,fee:null,feeManual:false,name:'',phone:'',ref:'',at:Date.now(),dateRead:false,hints:[],photo:'',editing:false,choice:'',removed:false,error:''};
  try{
   it.photo=await shotImage(files[i]);
   var r=await worker.recognize(files[i]);shotParse(it,(r&&r.data&&r.data.text)||'');
  }catch(e){
   if(!it.photo){continue}
   it.hints.push('This photo could not be read. Tap Edit and fill in the details.');
  }
  shotFee(it);SH.items.push(it);
 }
 try{await worker.terminate()}catch(e){}
 if(!SH.items.length){msg.textContent='None of the photos could be opened. Try again.';return}
 msg.textContent='Checking for duplicates...';
 await shotsCheck();
 shotsReview();
}
async function shotsCheck(){
 var refs=[];SH.items.forEach(function(it){if(it.ref&&refs.indexOf(it.ref)<0)refs.push(it.ref)});
 SH.checkNote='';
 if(!refs.length){SH.found=[];return}
 try{var j=await api('checkRefs',{refs:refs});SH.found=j.found||[]}
 catch(e){SH.found=[];SH.checkNote='Old entries could not be checked now. Duplicates are checked again when you add.'}
}
function shotMatches(it,idx){
 var out=[];if(!it.ref)return out;
 SH.found.forEach(function(f){if(f.ref===it.ref)out.push({where:f.type==='load'?'the Load tab':'the GCash tab',other:(f.type==='load')!==(it.kind==='load'),amount:f.amount,at:f.at,by:f.byName,batch:false})});
 SH.items.forEach(function(o,j){if(j<idx&&!o.removed&&o.choice!=='delete'&&o.ref===it.ref)out.push({where:'another photo in this upload',other:o.kind!==it.kind,amount:o.amount,at:o.at,by:'',batch:true})});
 return out;
}
function shotState(it,idx){
 var ms=shotMatches(it,idx),exact=ms.filter(function(m){return !m.other&&m.amount===it.amount});
 if(exact.length)return {skip:true,ms:exact,need:'',add:false,block:false};
 var need=ms.length?(ms.some(function(m){return m.other})?'other':'amount'):'';
 var incomplete=!(it.amount>0)||it.fee===null;
 var okChoice=!need||it.choice==='keep'||it.choice==='continue';
 return {skip:false,ms:ms,need:need,incomplete:incomplete,add:!it.removed&&!incomplete&&okChoice,block:!it.removed&&(incomplete||(need&&!it.choice))};
}
function uniq(a){return a.filter(function(x,i){return a.indexOf(x)===i})}
function localDT(ms){var d=new Date(ms),z=function(n){return (n<10?'0':'')+n};return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())+'T'+z(d.getHours())+':'+z(d.getMinutes())}
function shotCard(it,i){
 var st=shotState(it,i),h='<div class="card stack" style="gap:8px;'+(st.skip?'opacity:.65;':'')+(st.need&&!it.choice?'border:2px solid var(--warn);':'')+'" data-i="'+i+'">';
 h+='<div class="row" style="gap:10px;align-items:flex-start"><img src="'+it.photo+'" alt="Screenshot '+(i+1)+'" data-sh="zoom" data-i="'+i+'" style="width:64px;height:84px;object-fit:cover;border-radius:8px;cursor:pointer;flex:none">'+
  '<div class="grow stack" style="gap:2px;min-width:0"><div><b>'+esc(it.kind==='load'?'Load':gTypeName(it.type))+'</b> <span class="num">'+(it.amount>0?php(it.amount):'Amount not read')+'</span></div>'+
  '<div class="sm muted">Fee '+(it.fee===null?'not set':php(it.fee))+(it.feeManual?' (custom)':'')+'</div>'+
  '<div class="sm">'+esc(it.name||'No name')+(it.phone?' · '+esc(it.phone):'')+'</div>'+
  '<div class="sm muted">'+esc(dtLabel(it.at))+(it.dateRead?'':' (date not read)')+'</div>'+
  '<div class="sm muted">'+(it.ref?'Ref '+esc(it.ref):'No reference number')+'</div></div></div>';
 it.hints.forEach(function(x){h+='<div class="note warn">'+esc(x)+'</div>'});
 if(it.error)h+='<div class="note warn"><b>Not added.</b> '+esc(it.error)+'</div>';
 function mline(m){return 'Same reference number in '+m.where+': '+php(m.amount)+(m.batch?'':' on '+esc(dtLabel(m.at))+(m.by?' by '+esc(m.by):''))+'.'}
 if(st.skip)h+='<div class="note warn"><b>Already recorded.</b> '+uniq(st.ms.map(mline)).join(' ')+' Same amount, so this one is skipped.</div>';
 else if(st.need==='amount'){
  h+='<div class="note warn"><b>Check this one.</b> '+uniq(st.ms.map(mline)).join(' ')+' The amount is different.</div>'+
   '<div class="wrapbtns"><button class="btn '+(it.choice==='keep'?'primary':'soft')+'" data-sh="keep" data-i="'+i+'">Keep both</button><button class="btn '+(it.choice==='delete'?'danger':'soft')+'" data-sh="delete" data-i="'+i+'">Delete this one</button></div>';
 }else if(st.need==='other'){
  h+='<div class="note warn"><b>Already in the other tab or list.</b> '+uniq(st.ms.map(mline)).join(' ')+(it.choice==='review'?' Held for review. It will not be added.':' Continue to add it here too, or review it first.')+'</div>'+
   '<div class="wrapbtns"><button class="btn '+(it.choice==='continue'?'primary':'soft')+'" data-sh="continue" data-i="'+i+'">Continue</button><button class="btn '+(it.choice==='review'?'primary':'soft')+'" data-sh="review" data-i="'+i+'">Review</button></div>';
 }
 if(it.editing){
  h+='<div class="stack" style="gap:8px">'+
   (it.kind==='gcash'?'<div class="field"><label>Type</label><select data-sh-f="type" data-i="'+i+'"><option value="in"'+(it.type==='in'?' selected':'')+'>Cash in</option><option value="out"'+(it.type==='out'?' selected':'')+'>Cash out</option></select></div>':'')+
   '<div class="two"><div class="field"><label>Amount (PHP)</label><input type="number" inputmode="decimal" min="1" step="0.01" data-sh-f="amount" data-i="'+i+'" value="'+(it.amount||'')+'"></div><div class="field"><label>Fee (PHP)</label><input type="number" inputmode="decimal" min="0" step="0.01" data-sh-f="fee" data-i="'+i+'" value="'+(it.fee===null?'':it.fee)+'" placeholder="Automatic"></div></div>'+
   '<div class="field"><label>Name</label><input type="text" maxlength="40" data-sh-f="name" data-i="'+i+'" value="'+esc(it.name)+'"></div>'+
   '<div class="field"><label>Contact number</label><input type="text" inputmode="tel" maxlength="20" data-sh-f="phone" data-i="'+i+'" value="'+esc(it.phone)+'"></div>'+
   '<div class="field"><label>Reference number</label><input type="text" maxlength="24" data-sh-f="ref" data-i="'+i+'" value="'+esc(it.ref)+'"></div>'+
   '<div class="field"><label>Date and time</label><input type="datetime-local" data-sh-f="at" data-i="'+i+'" value="'+localDT(it.at)+'"></div></div>';
 }
 h+='<div class="wrapbtns"><button class="btn soft" data-sh="edit" data-i="'+i+'">'+ic('edit',18)+(it.editing?'Done':'Edit')+'</button><button class="btn ghost" data-sh="remove" data-i="'+i+'">'+ic('trash',18)+'Remove</button></div></div>';
 return h;
}
function shotsPaint(){
 var body=$sheet.querySelector('#sh-body');if(!body)return;
 var live=SH.items.map(function(it,i){return {it:it,i:i}}).filter(function(x){return !x.it.removed});
 var add=0,skip=0,choose=0,fix=0;
 live.forEach(function(x){var s=shotState(x.it,x.i);if(s.skip)skip++;else{if(s.add)add++;if(s.incomplete)fix++;else if(s.need&&!x.it.choice)choose++}});
 var h='<div class="note"><b>'+add+'</b> ready to add'+(skip?', <b>'+skip+'</b> skipped as duplicates':'')+(choose?', <b>'+choose+'</b> need your choice':'')+(fix?', <b>'+fix+'</b> need details':'')+'. Check each one, tap Edit to change anything, then add.</div>';
 if(SH.checkNote)h+='<div class="note warn">'+esc(SH.checkNote)+'</div>';
 h+=live.map(function(x){return shotCard(x.it,x.i)}).join('');
 var blockers=live.filter(function(x){return shotState(x.it,x.i).block}).length;
 h+=(blockers?'<div class="sm muted">Choose an action or fix the details on the highlighted ones, or remove them, to continue.</div>':'')+'<div class="wrapbtns"><button class="btn primary grow" id="sh-go"'+(add===0||blockers?' disabled':'')+'>Add '+add+' to history</button><button class="btn ghost" data-sheet="close">Cancel</button></div>';
 body.innerHTML=h;
}
function shotsReview(){
 openSheet(head('Summary of '+shotKindName(SH.kind)+' screenshots')+'<div id="sh-body" class="stack" style="gap:10px"></div>',function(p){
  p.addEventListener('click',shotClick);p.addEventListener('change',shotChange);
 });
 shotsPaint();
}
async function shotClick(e){
 var go=e.target.closest('#sh-go');if(go){shotsSave(go);return}
 var b=e.target.closest('[data-sh]');if(!b||!SH)return;
 var it=SH.items[+b.dataset.i],a=b.dataset.sh;if(!it)return;
 if(a==='zoom'){showPhoto(it.photo);return}
 if(a==='edit')it.editing=!it.editing;
 else if(a==='remove')it.removed=true;
 else if(a==='keep'||a==='delete'||a==='continue'||a==='review')it.choice=it.choice===a?'':a;
 shotsPaint();
}
async function shotChange(e){
 var t=e.target,f=t.dataset&&t.dataset.shF;if(!f||!SH)return;
 var it=SH.items[+t.dataset.i];if(!it)return;
 var v=t.value,recheck=false;
 if(f==='type'){it.type=v==='out'?'out':'in';shotFee(it)}
 else if(f==='amount'){it.amount=r2(v)>0?r2(v):0;shotFee(it)}
 else if(f==='fee'){if(String(v).trim()===''){it.feeManual=false;shotFee(it)}else{it.feeManual=true;it.fee=r2(v)}}
 else if(f==='name')it.name=v.trim().slice(0,40);
 else if(f==='phone')it.phone=v.replace(/[^0-9+*xX\- ]/g,'').trim().slice(0,20);
 else if(f==='ref'){it.ref=v.replace(/[^0-9A-Za-z]/g,'').slice(0,24);it.choice='';recheck=true}
 else if(f==='at'){var ms=new Date(v).getTime();if(!isNaN(ms)){it.at=ms;it.dateRead=true;shotFee(it)}}
 it.error='';
 if(recheck)await shotsCheck();
 shotsPaint();
}
async function shotsSave(btn){
 var plan=SH.items.map(function(it,i){return {it:it,st:shotState(it,i)}}).filter(function(x){return !x.it.removed&&x.st.add});
 if(!plan.length)return;
 btn.disabled=true;var done=0,skipped=0,stop='';
 SH.items.forEach(function(it,i){if(!it.removed&&(it.choice==='delete'||shotState(it,i).skip))it.done=true});
 for(var k=0;k<plan.length;k++){
  var it=plan[k].it;btn.textContent='Adding '+(k+1)+' of '+plan.length+'...';
  try{
   await api('addGcashShot',{kind:it.kind,type:it.type,amount:it.amount,fee:it.fee,at:it.at,ref:it.ref,name:it.name,phone:it.phone,photoData:it.photo,force:!!plan[k].st.need,cid:'shot-'+SH.sid+'-'+it.n});
   it.removed=true;it.done=true;done++;
  }catch(x){
   if(x&&x.code==='duplicate'){it.removed=true;it.done=true;skipped++}
   else if(x&&x.code==='network'){stop=x.message;break}
   else it.error=(x&&x.message)||'Could not add this one.';
  }
 }
 SH.items=SH.items.filter(function(it){return !it.done});
 var left=SH.items.filter(function(it){return !it.removed}).length;
 toast('Added '+done+(skipped?'. Skipped '+skipped+' duplicate'+(skipped===1?'':'s'):'')+(left?'. '+left+' still need a look.':'.'));
 if(!left&&!stop){closeSheet();return}
 await shotsCheck();shotsPaint();
 if(stop)toast(stop);
}


/* ================= move money between wallets ================= */
function wName(w){return w==='load'?'Load':'GCash'}
function xferCard(canEdit){
 var list=(S.transfers||[]).slice().sort(function(a,b){return b.at-a.at}),m=S.money||{};
 var h='<div class="card stack" style="gap:8px"><b>Moved between wallets</b>'+
  '<div class="row between"><span class="sm">GCash to Load</span><span class="num">'+php(m.toLoad||0)+'</span></div><div class="row between"><span class="sm">Load to GCash</span><span class="num">'+php(m.toGcash||0)+'</span></div>'+
  '<div class="row between"><span class="sm">Service fees paid for moving</span><span class="num">'+php(m.xferFees||0)+'</span></div><div class="sm muted">Moving money between the two wallets is for emergencies. It does not change the capital left, the cash in the drawer, or the income. A service fee is taken from the wallet the money leaves and is listed here on its own.</div>';
 if(canEdit)h+='<div class="wrapbtns"><button class="btn soft" data-act="xfer" data-from="gcash">Move GCash to Load</button><button class="btn soft" data-act="xfer" data-from="load">Move Load to GCash</button></div>';
 if(list.length)h+='<div class="list">'+list.slice(0,8).map(function(t){var v=t.status==='void';return '<button class="li lib'+(v?' voided':'')+'" data-act="xitem" data-id="'+esc(t.id)+'"><div class="grow"><div><b>'+wName(t.from)+' to '+wName(t.to)+'</b> <span class="muted num">'+php(t.amount)+'</span>'+(t.fee>0?' <span class="chip">Fee '+php(t.fee)+'</span>':'')+(v?' <span class="chip admin">Voided</span>':'')+'</div><div class="sm muted">'+esc(dtLabel(t.at))+' by '+esc(t.byName)+(t.note?' · '+esc(t.note):'')+'</div></div></button>'}).join('')+'</div>';
 return h+'</div>';
}
function openXfer(from){
 var m=S.money||{};
 openSheet(head('Move money between wallets')+
 '<p style="margin:0">Use this in an emergency, for example when the Load wallet is empty but the GCash wallet has money. The total money stays the same.</p>'+
 '<div class="field"><label>Direction</label><div class="seg" id="xf-d"><button type="button" class="'+(from==='gcash'?'on':'')+'" data-f="gcash">GCash to Load</button><button type="button" class="'+(from==='load'?'on':'')+'" data-f="load">Load to GCash</button></div></div>'+
 '<div class="field"><label for="xf-a">Amount (PHP)</label><input id="xf-a" type="number" inputmode="decimal" min="1" step="0.01" data-focus></div>'+
 '<div class="field"><label for="xf-f">Service fee (PHP)</label><input id="xf-f" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0"><div class="sm muted">Type 0 if there is no fee. The fee is taken from the wallet the money leaves.</div></div>'+
 '<div class="field"><label for="xf-n">Reason (optional)</label><input id="xf-n" type="text" maxlength="80" placeholder="Example: emergency load orders"></div>'+
 '<div class="receipt" id="xf-rc"></div><div class="err" id="xf-err"></div>'+
 '<div class="wrapbtns"><button class="btn primary grow" id="xf-go">Move money</button><button class="btn ghost" data-sheet="close">Cancel</button></div>',function(p){
  var dir=from;
  function q(i){return p.querySelector('#'+i)}
  function paint(){
   var a=r2(q('xf-a').value),fe=r2(q('xf-f').value)||0,to=dir==='gcash'?'load':'gcash',mm=S.money||m,sb=dir==='load'?mm.loadBal:mm.gcashBal,db=to==='load'?mm.loadBal:mm.gcashBal;
   q('xf-rc').innerHTML='<div class="r"><span>'+wName(dir)+' wallet now</span><span>'+php(sb)+'</span></div><div class="r"><span>'+wName(to)+' wallet now</span><span>'+php(db)+'</span></div>'+(a>0?'<hr>'+(fe>0?'<div class="r"><span>Service fee</span><span>'+php(fe)+'</span></div>':'')+'<div class="r tot"><span>'+wName(dir)+' after</span><span class="'+(sb-a-fe<0?'neg':'')+'">'+php(sb-a-fe)+'</span></div><div class="r tot"><span>'+wName(to)+' after</span><span>'+php(db+a)+'</span></div>':'');
  }
  q('xf-d').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;dir=b.dataset.f;[].forEach.call(q('xf-d').children,function(x){x.classList.toggle('on',x===b)});paint()});
  q('xf-a').addEventListener('input',paint);q('xf-f').addEventListener('input',paint);paint();
  q('xf-go').addEventListener('click',async function(){
   var a=r2(q('xf-a').value),fe=r2(q('xf-f').value)||0,err=q('xf-err'),mm=S.money||m,sb=dir==='load'?mm.loadBal:mm.gcashBal;
   if(fe<0){err.textContent='The service fee cannot be below 0.';return}
   if(!(a>0)){err.textContent='Enter the amount to move.';return}
   if(a+fe>sb+0.004){err.textContent='The '+wName(dir)+' wallet has only '+php(sb)+'. It needs the amount plus the service fee.';return}
   this.disabled=true;err.textContent='';
   try{await api('addTransfer',{from:dir,amount:a,fee:fe,note:q('xf-n').value.trim(),cid:'x'+Date.now()+Math.random().toString(36).slice(2,6)});closeSheet();toast('Moved '+php(a)+' from '+wName(dir)+' to '+wName(dir==='gcash'?'load':'gcash'))}
   catch(e){err.textContent=e.message;this.disabled=false}
  });
 });
}
function openXferDetail(id){
 var t=(S.transfers||[]).filter(function(x){return x.id===id})[0];if(!t)return;
 var h=head(wName(t.from)+' to '+wName(t.to))+'<div class="receipt"><div class="r"><span>Service fee</span><span>'+php(t.fee||0)+'</span></div><div class="r tot"><span>Amount moved</span><span>'+php(t.amount)+'</span></div></div><div class="stamp">'+ic('clock',16)+'<span>Moved by <b>'+esc(t.byName)+'</b> on '+esc(dtLabel(t.at))+'</span></div>'+(t.note?'<div class="sm">Reason: '+esc(t.note)+'</div>':'');
 if(t.status==='void')h+='<div class="note warn"><b>Voided</b> by '+esc(t.voidedByName)+' on '+esc(dtLabel(t.voidedAt))+'.<br>Reason: '+esc(t.voidReason)+'</div>';
 else if(canTouch(t))h+='<div class="wrapbtns"><button class="btn danger" id="vx">'+ic('trash',18)+'Void this move</button></div>';
 openSheet(h,function(p){var b=p.querySelector('#vx');if(b)b.addEventListener('click',function(){voidSheet('Void this move?','The money goes back to the '+wName(t.from)+' wallet. This only works if the '+wName(t.to)+' wallet still has it.','voidTransfer',t.id)})});
}

/* ================= events ================= */
$app.addEventListener('input',function(e){
 var t=e.target;
 if(t.classList&&t.classList.contains('rin')&&S.rdraft){var k=t.dataset.k;if(t.dataset.x){S.rdraft.loadx[t.dataset.x]=t.value}else if(S.rdraft[k]){S.rdraft[k][+t.dataset.i][+t.dataset.c]=t.value}return}
 if(e.target.id==='q'){S.q=e.target.value;var g=document.getElementById('grid');if(g)g.innerHTML=gridHtml()}
});
$app.addEventListener('change',async function(e){
 var t=e.target;
 if(t.id==='pf-file'){var f=t.files[0];if(!f)return;try{var d=await squarePhoto(f);await api('setPhoto',{photoData:d});toast('Photo saved')}catch(x){toast(x.message==='image'?'That photo could not be read.':x.message)}return}
 if(!t.dataset)return;
 if(t.dataset.act==='partner'){try{await api('updateAccount',{id:t.dataset.id,partner:t.checked})}catch(x){toast(x.message);t.checked=!t.checked}}
 else if(t.dataset.act==='glpartner'){try{await api('updateAccount',{id:t.dataset.id,glPartner:t.checked})}catch(x){toast(x.message);t.checked=!t.checked}}
 else if(t.dataset.act==='smsauto'){try{await api('saveSms',{auto:t.checked});toast(t.checked?'Texts are added automatically':'Texts wait for a tap')}catch(x){toast(x.message);t.checked=!t.checked}}
});
$app.addEventListener('click',async function(e){
 var b=e.target.closest('[data-act]');if(!b||b.tagName==='INPUT')return;
 var a=b.dataset.act,id=b.dataset.id,me=cur();
 if(id&&String(id).indexOf('pending-')===0&&['sale','gitem','titem','pitem'].indexOf(a)>-1){toast('Still sending. Try again in a moment.');return}
 if(a==='pick')startPin(id);
 else if(a==='digit')padPress(b.dataset.d);
 else if(a==='back')padPress('back');
 else if(a==='ok')padPress('ok');
 else if(a==='flowcancel')flowCancel();
 else if(a==='retry'){S.loadErr='';draw();loadPublic()}
 else if(a==='install'){if(deferredPrompt){deferredPrompt.prompt();try{await deferredPrompt.userChoice}catch(x){}deferredPrompt=null;draw()}}
 else if(a==='tab'){S.tab=b.dataset.t;draw();window.scrollTo(0,0)}
 else if(a==='month'){S.month=b.dataset.m;draw()}
 else if(a==='atab'){S.adminTab=b.dataset.t;draw()}
 else if(a==='logout')logout();
 else if(a==='changepin')startChangePin();
 else if(a==='refresh')sync(true);
 else if(a==='dismissfail'){S.failed.splice(+id,1);draw()}
 else if(a==='photo'){var pf=document.getElementById('pf-file');if(pf)pf.click()}
 else if(a==='print'){printReport()}
 else if(a==='pastesms'){openMessages()}
 else if(a==='copy'){try{navigator.clipboard.writeText(b.dataset.v);toast('Copied')}catch(x){toast('Press and hold to copy')}}
 else if(!me)return;
 else if(a==='item'){var it=S.items.filter(function(x){return x.id===id})[0];if(!it)return;if(me.role==='viewer')openDetails(it);else openSale(it)}
 else if(a==='additem')openItem(null);
 else if(a==='sale')openSaleDetail(id);
 else if(a==='gnew')openGcash(b.dataset.k);
 else if(a==='gsub'){S.gsub=b.dataset.s;draw()}
 else if(a==='ssub'){S.ssub=b.dataset.s;draw()}
 else if(a==='gphoto'){showPhoto(driveImg(b.dataset.p,1200),b.dataset.p)}
 else if(a==='gshots'){openShots(b.dataset.k==='load'?'load':'gcash')}
 else if(a==='topup')openTopup(b.dataset.w);
 else if(a==='buy')openPurchase();
 else if(a==='pitem')openPurchaseDetail(id);
 else if(a==='titem')openTopupDetail(id);
 else if(a==='xfer')openXfer(b.dataset.from==='load'?'load':'gcash');
 else if(a==='xitem')openXferDetail(id);
 else if(a==='gitem')openGcashDetail(id);
 else if(a==='gstmt')openStatement();
 else if(a==='inboxadd'){try{await api('inboxAdd',{id:id,type:b.dataset.k});toast('Added')}catch(x){toast(x.message)}}
 else if(a==='inboxlink'){try{await api('inboxAdd',{id:id,linkId:b.dataset.g});toast('Linked to the typed entry')}catch(x){toast(x.message)}}
 else if(a==='inboxskip'){try{await api('inboxIgnore',{id:id})}catch(x){toast(x.message)}}
 else if(a==='redit')rateStart(b.dataset.k)
 else if(a==='radd')rateAdd(b.dataset.k)
 else if(a==='rcancel'){S.redit[b.dataset.k]=false;draw()}
 else if(a==='rsave')rateSave(b.dataset.k)
 else if(a==='rdel'){S.rdraft[b.dataset.k].splice(+b.dataset.i,1);draw()}
 else if(me.role!=='admin')return;
 else if(a==='addacc')openAddAccount();
 else if(a==='reveal'){S.reveal[id]=!S.reveal[id];draw()}
 else if(a==='resetpin'){var ac=byId(id);if(ac)confirmSheet('Reset PIN for '+ac.name+'?','The PIN goes back to '+DEFAULT_PIN+'. '+ac.name+' will be logged out and must choose a new PIN at the next login.','Reset PIN',function(){return api('resetPin',{id:id})})}
 else if(a==='setrole'){
  var t=byId(id),r=b.dataset.r;if(!t||t.role===r)return;
  try{await api('updateAccount',{id:id,role:r});toast(t.name+' is now '+r)}catch(x){toast(x.message)}
 }
 else if(a==='delacc'){
  var d=byId(id);if(!d)return;
  confirmSheet('Remove '+d.name+'?','The account and PIN are deleted. Past sales stay in the records.','Remove account',function(){return api('deleteAccount',{id:id})},true);
 }
 else if(a==='newkey')confirmSheet('Make a new key?','The old key stops working. You must paste the new link into the forwarding app on the phone.','Make new key',function(){return api('saveSms',{newKey:true})});
 else if(a==='savecap'){
  var val=Number(document.getElementById('cap').value)||0;
  try{await api('saveSettings',{capital:val});toast('Capital saved')}catch(x){toast(x.message)}
 }
});

$sheet.addEventListener('click',function(e){var b=e.target.closest('[data-act="gitem"]');if(b){openGcashDetail(b.dataset.id)}});

/* a photo that cannot load is replaced by a bottle icon */
document.addEventListener('error',function(e){
 var t=e.target;if(!t||t.tagName!=='IMG'||!t.dataset.fb)return;
 if(t.dataset.fb==='av'){t.replaceWith(document.createTextNode(t.dataset.i||'?'));return}
 var w=document.createElement('div');w.innerHTML=ic('bottle',t.closest('.ph')?44:28);
 t.replaceWith(w.firstChild);
},true);

/* ================= start ================= */
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
init();
})();
